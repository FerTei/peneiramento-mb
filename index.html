<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <!-- Faz a página se ajustar à tela do celular -->
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Peneiramento MB</title>
  <meta name="theme-color" content="#1f2a44">

  <!-- Arquivo de aparência (cores, tamanhos, botões) -->
  <link rel="stylesheet" href="estilo.css">
</head>
<body>

  <!-- Cabeçalho fixo no topo, aparece em todas as telas -->
  <header>
    <img src="logo.png" alt="MB">
    <h1>Peneiramento de Catalisador</h1>
  </header>

  <!-- Área vazia: o JavaScript (app.js) desenha cada tela aqui dentro -->
  <main id="app"></main>

  <!-- Ordem importa: primeiro o logo, depois a lógica do app -->
  <script src="logo.js"></script>
  <script src="app.js"></script>
</body>
</html>
